<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e293b"/>
      <stop offset="40%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#f97316"/>
      <stop offset="50%" stopColor="#fb923c"/>
      <stop offset="100%" stopColor="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Book Cover Background -->
  <rect x="0" y="0" width="600" height="800" rx="16" fill="url(#bgGrad)"/>

  <!-- Left Spine Shadow -->
  <rect x="0" y="0" width="30" height="800" fill="rgba(0,0,0,0.3)"/>
  <line x1="30" y1="0" x2="30" y2="800" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Subtle Chemical / Hexagon Grid Background -->
  <g stroke="rgba(249,115,22,0.18)" stroke-width="1.5" fill="none">
    <polygon points="450,120 490,140 490,185 450,205 410,185 410,140"/>
    <polygon points="490,185 530,205 530,250 490,270 450,250 450,205"/>
    <polygon points="410,185 450,205 450,250 410,270 370,250 370,205"/>
    <circle cx="450" cy="162" r="22" stroke="rgba(249,115,22,0.25)"/>

    <polygon points="120,540 160,560 160,605 120,625 80,605 80,560"/>
    <polygon points="160,605 200,625 200,670 160,690 120,670 120,625"/>
    <circle cx="160" cy="647" r="20" stroke="rgba(249,115,22,0.25)"/>
  </g>

  <!-- Top Series Badge -->
  <rect x="70" y="60" width="220" height="34" rx="17" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="1.5"/>
  <text x="180" y="82" fill="#fb923c" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="1">HSC CHEMISTRY SERIES</text>

  <!-- Main Title Area -->
  <text x="70" y="180" fill="#ffffff" font-size="44" font-weight="900" font-family="'Segoe UI', system-ui, sans-serif" letter-spacing="-0.5">HSC ORGANIC</text>
  <text x="70" y="235" fill="url(#accentGrad)" font-size="48" font-weight="900" font-family="'Segoe UI', system-ui, sans-serif" letter-spacing="-0.5">CHEMISTRY</text>
  <text x="70" y="285" fill="#f8fafc" font-size="28" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif">REACTION ROADMAP</text>

  <!-- Subtitle Bengali -->
  <text x="70" y="340" fill="#94a3b8" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif">
    জৈব রসায়নের সকল বিক্রিয়া ও রূপান্তরের মেগা ফ্লোচার্ট
  </text>

  <!-- Center Graphic: Benzene Ring Reaction Network -->
  <g transform="translate(300, 480)" filter="url(#shadow)">
    <!-- Central Hexagon -->
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="rgba(249,115,22,0.12)" stroke="#f97316" stroke-width="4"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#fb923c" stroke-width="3" stroke-dasharray="6,4"/>

    <!-- Reaction Arrows radiating -->
    <line x1="0" y1="-70" x2="0" y2="-120" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="-40" y="-145" width="80" height="26" rx="6" fill="#f97316"/>
    <text x="0" y="-128" fill="#ffffff" font-size="13" font-weight="800" font-family="sans-serif" text-anchor="middle">NO₂ (Nitration)</text>

    <line x1="60" y1="35" x2="110" y2="65" stroke="#f97316" stroke-width="3"/>
    <rect x="110" y="52" width="70" height="26" rx="6" fill="#f97316"/>
    <text x="145" y="69" fill="#ffffff" font-size="13" font-weight="800" font-family="sans-serif" text-anchor="middle">Halogen</text>

    <line x1="-60" y1="35" x2="-110" y2="65" stroke="#f97316" stroke-width="3"/>
    <rect x="-180" y="52" width="70" height="26" rx="6" fill="#f97316"/>
    <text x="-145" y="69" fill="#ffffff" font-size="13" font-weight="800" font-family="sans-serif" text-anchor="middle">Alkylation</text>
  </g>

  <!-- Bottom Details Bar -->
  <line x1="70" y1="710" x2="530" y2="710" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <text x="70" y="745" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, sans-serif">ORMISSION PUBLICATIONS</text>
  <text x="530" y="745" fill="#ea580c" font-size="15" font-weight="800" font-family="system-ui, sans-serif" text-anchor="end">EDITION 2026</text>
</svg>
